services:
  api:
   build:
    context: .
    dockerfile: Dockerfile
   image: asp_net_api_v_1_0_0
   ports:
    - "5003:8080"
   environment:
    - ASPNETCORE_URLS=http://+:8080
    - ASPNETCORE_ENVIRONMENT=Development
    - ConnectionStrings__DefaultConnection=Host=postgresDb;username=postgres;password=RenaultClio19d;database=WorkerDb; TrustServerCertificate=true
   depends_on:
    - postgresDb
  
  postgresDb:
    image: postgres:latest
    environment:
     POSTGRES_DB: WorkerDb
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: RenaultClio19d
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgresDb

networks:
  default:    
   name: sd_network

volumes:
  pgdata: