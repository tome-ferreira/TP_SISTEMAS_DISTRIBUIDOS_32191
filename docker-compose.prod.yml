services:
  api:
   image: tomeferreira/tp-sistemas-distribuidos-api:v1.0.0
   ports:
    - "5003:8080"
   environment:
    - ASPNETCORE_URLS=http://+:8080
    - ASPNETCORE_ENVIRONMENT=Development
    - ConnectionStrings__DefaultConnection=Host=postgresDb;username=postgres;password=RenaultClio19d;database=WorkerDb; TrustServerCertificate=true
   depends_on:
    - postgresDb
  
  postgresDb:
    image: postgres:latest
    environment:
     POSTGRES_DB: WorkerDb
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: RenaultClio19d
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  

networks:
  default:    
   name: sd_network

volumes:
  pgdata: